[package]
name = "opencode-evidence-distiller"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Exact pins: upstream Rust API is not treated as stable.
ast-grep-core = "=0.45.1"
ast-grep-language = "=0.45.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[[bin]]
name = "opencode-impact-index"
path = "src/impact_index.rs"

[[bin]]
name = "opencode-patch-executor"
path = "src/patch_executor.rs"

[[bin]]
name = "opencode-patch-compiler"
path = "src/patch_compiler.rs"

[[bin]]
name = "opencode-invariant-verifier"
path = "src/invariant_verifier.rs"
