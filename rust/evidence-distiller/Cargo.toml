[package]
name = "opencode-evidence-distiller"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Exact pins: upstream Rust API is not treated as stable.
ast-grep-core = "=0.45.1"
ast-grep-language = "=0.45.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
