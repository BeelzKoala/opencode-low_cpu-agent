[package]
name = "opencode-evidence-distiller"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Exact pin: canonical schema API is experimental and treated as unstable.
jsonschema = { version = "=0.49.9", default-features = false }
sha2 = "=0.10.9"

# C3_RUFF_PARSER_PIN_BEGIN
# Ruff parser/AST are internal APIs: pin the exact upstream commit.
ruff_python_parser = { git = "https://github.com/astral-sh/ruff", rev = "9e4938c4a60bed3e87a11ee1e1db1bd23f4d964a" }
ruff_python_ast = { git = "https://github.com/astral-sh/ruff", rev = "9e4938c4a60bed3e87a11ee1e1db1bd23f4d964a" }
ruff_text_size = { git = "https://github.com/astral-sh/ruff", rev = "9e4938c4a60bed3e87a11ee1e1db1bd23f4d964a" }
# C3_RUFF_PARSER_PIN_END

# Exact pins: upstream Rust API is not treated as stable.
ast-grep-core = "=0.45.1"
ast-grep-language = "=0.45.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[[bin]]
name = "opencode-impact-index"
path = "src/impact_index.rs"

[[bin]]
name = "opencode-patch-executor"
path = "src/patch_executor.rs"

[[bin]]
name = "opencode-patch-compiler"
path = "src/patch_compiler.rs"

[[bin]]
name = "opencode-invariant-verifier"
path = "src/invariant_verifier.rs"

[[bin]]
name = "opencode-structural-index"
path = "src/structural_index.rs"

[[bin]]
name = "opencode-context-planner"
path = "src/context_planner.rs"

[[bin]]
name = "opencode-sealed-edit-site"
path = "src/sealed_edit_site.rs"

[[bin]]
name = "opencode-retrieval-ranker"
path = "src/retrieval_ranker.rs"

[[bin]]
name = "opencode-semantic-resolver"
path = "src/semantic_resolver.rs"

[[bin]]
name = "opencode-completion-authorizer"
path = "src/completion_authorizer.rs"

[[bin]]
name = "opencode-sealed-slice-store"
path = "src/sealed_slice_store.rs"

[[bin]]
name = "opencode-ruff-python-bridge"
path = "src/ruff_python_bridge.rs"

[[bin]]
name = "opencode-model-abi-compiler"
path = "src/model_abi_compiler.rs"
